name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository rules
        run: python3 scripts/check.py
      - name: Tests of the rules
        run: python3 -m unittest discover -s tests -v
      - name: Skill selftests
        run: python3 skills/gemini-web/scripts/gemini_web.py --selftest
